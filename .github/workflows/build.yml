name: Build APK

on:
  push:
    branches: [ master, mingli, huadeng ]
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体：debug 产出可调试 APK，release 产出发布包'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    # 不限仓库：fork 也能直接构建（原先写死 MiaoWuNYA 的判断已移除）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # 提前把 NDK / CMake 装好并校验，避免 AGP 在 Gradle 任务内部隐式下载。
      # 版本取自 gradle.properties，与模块 ndkVersion 同源。
      - name: Setup Android native toolchain
        uses: ./.github/actions/setup-android-native
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade pip & setuptools
        run: pip install --upgrade pip setuptools wheel
      - name: Force full Python reinstall (auto-update all packages)
        run: rm -rf app/build/python $HOME/.gradle/caches/chaquopy*
      - name: Pre-install setuptools for build
        run: pip install --upgrade pip setuptools wheel 2>&1 | tail -3
      - name: Write signing config
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            echo "$KEY_BASE64" | base64 -d > app/app.key
            echo "$SIGNING_CONFIG" > local.properties
          else
            # 密钥未配置时回退 debug 签名
            cat > local.properties << 'EOF'
          storeFile=app.key
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          fi
      - name: Build
        env:
          VARIANT: ${{ inputs.variant || 'debug' }}
          # 与环境变量双保险：-P 参数偶发读不到，两处都置位更稳
          HDGUARD_SKIP_CHECK: 'true'
        run: |
          chmod +x gradlew
          rm -rf app/build/python/  # 清理之前失败构建的脏缓存
          TASK="assembleDebug"
          if [ "$VARIANT" = "release" ]; then TASK="assembleRelease"; fi
          echo "building $TASK"
          # fork 没有原始签名口令，hdguard 因子校验必然失败；开关默认关闭，不影响上游与发版
          ./gradlew "$TASK" -Phdguard.skipCheck=true -x :web:buildWebUi --no-build-cache --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      # AGP 9 已移除 applicationVariants，无法在 Gradle 里改产物名，改在这里重命名。
      # 默认名 app-release.apk 不带版本号，分批下载时容易和旧版本混淆。
      # 命名保持英文，避免升级工具处理中文路径出错。
      - name: Rename APK
        env:
          VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          set -e
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "versionName=$V variant=$VARIANT"
          for f in app/build/outputs/apk/"$VARIANT"/*.apk; do
            [ -e "$f" ] || { echo "没有找到 APK，保持原样"; exit 0; }
            case "$f" in
              *"$V"*) echo "已是带版本号的名称：$f" ;;
              *) mv "$f" "app/build/outputs/apk/$VARIANT/rikkahub-plus-${V}-${VARIANT}-arm64-v8a.apk"
                 echo "重命名为 rikkahub-plus-${V}-${VARIANT}-arm64-v8a.apk" ;;
            esac
          done
          ls -la app/build/outputs/apk/"$VARIANT"/
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ inputs.variant || 'debug' }}-apk
          path: app/build/outputs/apk/*/*.apk
